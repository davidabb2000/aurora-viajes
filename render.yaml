# Blueprint de Render para el backend de Aurora Viajes.
# El frontend no va aqui: se despliega en Cloudflare Pages.
#
# dockerfilePath y dockerContext son relativos a la raiz del repositorio,
# segun la referencia de Render, por eso no se usa rootDir.
services:
  - type: web
    name: aurora-backend
    runtime: docker
    repo: https://github.com/davidabb2000/aurora-viajes
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Fijas ---
      - key: MOTOR_BD
        value: mysql
      - key: ENTORNO
        value: produccion
      - key: DEPURACION
        value: "false"
      - key: MYSQL_CHARSET
        value: utf8mb4
      - key: MYSQL_DRIVER
        value: aiomysql

      # --- Generada por Render ---
      - key: SECRET_KEY
        generateValue: true

      # --- Se piden al crear el blueprint ---
      # URL completa del MySQL externo (Aiven, Clever Cloud...). Si trae
      # ssl-mode=REQUIRED, el backend activa TLS solo.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # URL publica del frontend en Cloudflare Pages, sin barra final.
      - key: ORIGENES_PERMITIDOS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # --- Opcionales: dejar vacias si no se usan ---
      - key: PROVEEDOR_IA_API_KEY
        sync: false
      - key: PROVEEDOR_IA_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: PROVEEDOR_IA_MODELO
        value: llama-3.1-8b-instant
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
